name: Commit Message Check

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited

jobs:
  commit-message-check:
    name: commit-message-check
    runs-on: ubuntu-latest

    steps:
      - name: Validate commit messages
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const allowedPrefix = /^(feat|fix|docs|chore|refactor|test|build|ci|perf|style|revert)(\([^)]+\))?!?:\s*/u;
            const hasJapanese = /[\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Han}]/u;
            const violations = [];

            for (const commit of commits) {
              const message = commit.commit.message || "";
              const subject = message.split("\n")[0].trim();

              if (subject.startsWith("Merge ")) {
                continue;
              }

              const normalized = subject.replace(allowedPrefix, "");
              if (!hasJapanese.test(normalized)) {
                violations.push(`- ${commit.sha.slice(0, 7)}: ${subject}`);
              }
            }

            if (violations.length > 0) {
              core.setFailed(
                [
                  "コミットメッセージ規約違反があります。",
                  "種別プレフィックスは英語でも構いませんが、説明部分は日本語で記述してください。",
                  ...violations,
                ].join("\n"),
              );
            }
