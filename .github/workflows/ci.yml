name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs == 'true' && steps.filter.outputs.code != 'true' }}
      e2e_relevant: ${{ steps.filter.outputs.e2e == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/**'
              - '**/*.md'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/pull_request_template.md'
              - 'CHANGELOG.md'
              - 'CODEOWNERS'
            code:
              - '.github/workflows/**'
              - 'frontend/**'
              - 'services/**'
              - 'deployments/**'
              - 'docker-compose.yml'
              - 'Makefile'
              - '.env.example'
              - '.dockerignore'
              - '.gitignore'
              - 'package*.json'
            e2e:
              - '.github/workflows/**'
              - 'frontend/**'
              - 'services/api-gateway/**'
              - 'services/article-service/**'
              - 'services/notification-service/**'
              - 'deployments/**'
              - 'docker-compose.yml'
              - 'Makefile'
              - '.env.example'
              - 'docs/test-policy.md'
              - 'docs/current-status.md'

  fast:
    name: fast
    runs-on: ubuntu-latest
    needs: changes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Node.js
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: frontend
        run: npm ci

      - name: Verify repository
        if: needs.changes.outputs.docs_only != 'true'
        run: make verify

      - name: Skip heavy verification for docs-only changes
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "docs-only change detected; skipping make verify"

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: tech_feed_hub
          MYSQL_USER: app_user
          MYSQL_PASSWORD: app_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uapp_user -papp_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run article-service integration tests
        env:
          ARTICLE_SERVICE_TEST_MYSQL_DSN: app_user:app_password@tcp(127.0.0.1:3306)/tech_feed_hub?parseTime=true&multiStatements=true
        run: make test-article-integration

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 30
    if: needs.changes.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.e2e_relevant == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create env file
        run: cp .env.example .env

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start compose stack
        run: make e2e-up

      - name: Seed deterministic E2E data
        run: make e2e-seed

      - name: Run E2E smoke tests
        run: make test-e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Stop compose stack
        if: always()
        run: make e2e-down
