name: PR Body Check

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  template-check:
    name: template-check
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR title and body
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title || "";
            const body = pr.body || "";

            const requiredSections = [
              "## 概要",
              "## 背景 / 目的",
              "## 変更内容",
              "## 影響範囲",
              "## 検証",
              "## API / DB / Infra への影響",
              "## ドキュメント",
              "## リスク / 注意点",
              "## 補足",
            ];

            const missingSections = requiredSections.filter((section) => !body.includes(section));
            const hasJapaneseInTitle = /[\p{Script=Hiragana}\p{Script=Katakana}\p{Script=Han}]/u.test(title);

            const errors = [];
            if (!hasJapaneseInTitle) {
              errors.push("PR title must include Japanese text per repository policy.");
            }
            if (missingSections.length > 0) {
              errors.push(`PR body is missing template sections: ${missingSections.join(", ")}`);
            }

            if (errors.length > 0) {
              core.setFailed(errors.join("\n"));
            }
