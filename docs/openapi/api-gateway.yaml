openapi: 3.0.3
info:
  title: Tech Feed Hub API Gateway
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /api/v1/articles:
    get:
      summary: List articles
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: source_id
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Article list
  /api/v1/articles/{id}:
    get:
      summary: Get article detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Article detail
  /api/v1/sources:
    get:
      summary: List sources
      responses:
        "200":
          description: Source list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Source"
                required:
                  - items
    post:
      summary: Create source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceInput"
      responses:
        "201":
          description: Created source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "400":
          description: Validation error
        "409":
          description: Source already exists
  /api/v1/sources/{id}:
    get:
      summary: Get source detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Source detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          description: Source not found
    patch:
      summary: Update source
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceInput"
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "400":
          description: Validation error
        "404":
          description: Source not found
        "409":
          description: Source conflict
    delete:
      summary: Delete source
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Source deleted
        "404":
          description: Source not found
        "409":
          description: Source still referenced
components:
  schemas:
    Source:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum:
            - rss
        fetch_url:
          type: string
          format: uri
        fetch_method:
          type: string
          enum:
            - rss
        interval_minutes:
          type: integer
        default_category:
          type: string
        is_enabled:
          type: boolean
        last_fetched_at:
          type: string
          format: date-time
          nullable: true
        last_fetch_status:
          type: string
          nullable: true
        last_error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - type
        - fetch_url
        - fetch_method
        - interval_minutes
        - default_category
        - is_enabled
        - created_at
        - updated_at
    SourceInput:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - rss
        fetch_url:
          type: string
          format: uri
        fetch_method:
          type: string
          enum:
            - rss
        interval_minutes:
          type: integer
          minimum: 1
          maximum: 10080
        default_category:
          type: string
        is_enabled:
          type: boolean
      required:
        - name
        - type
        - fetch_url
        - fetch_method
        - interval_minutes
        - default_category
        - is_enabled
